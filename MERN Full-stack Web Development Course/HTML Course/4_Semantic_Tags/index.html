<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    A semantic element clearly describes its meaning to both the browser and developer.
    Some examples of the semantic tags are:- <header>, <nav>, <section>, <article>, <aside>, <footer>, <table>, <img> etc.
    Using semantic tags helps the developer to completely differenteate the tags from each other, so that each one of them can fulfill their purpose on the browser to the full extent.

    The <section> element defines a section in a document. According to W3C's HTML documentation: "A section is a thematic grouping of content, typically with a heading. Examples where <section> element can be used: Chapters, Introduction, News items"
    
    The <article> element specifies independent, self-contained content.
    Examples: Forum posts, Blog posts, User comments

    We can nest <section> elements within the <article> elements, and we can also nest <article> elements within the <section> elements.
    
    The <header> element represents a container for introductory content or a set of navigational links. It contains one or more heading elements, logo or icon, authorship information. We can have multiple <header> elements within a single document, but a <header> tag can't be replaced by a <footer>, <address>, or another <header> element.
    
    The <footer> element defines a footer for a document or section.

    A <footer> element typically contains:

    authorship information
    copyright information
    contact information
    sitemap
    back to top links
    related documents

    You can have several <footer> elements in one   document.
    
    The <nav> element defines a set of navigation links.
    Notice that NOT all links of a document should be inside a <nav> element. The <nav> element is intended only for major blocks of navigation links.
    We use <a> (anchor) tag for storing links within <nav> tags.
    
    The <aside> element defines some content aside from the content it is placed in (like a sidebar).

    The <aside> content should be indirectly related to the surrounding content.
    -->
</body>
</html>
