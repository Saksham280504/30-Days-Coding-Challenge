<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="../6_Links/page.html">
        <label for="fname">First Name : </label>
        <input type="text" id="fname" name="fname">
        <br>
        <br>
        <label for="lname">Last Name : </label>
        <input type="text" id="lname" name="lname">

        <p>Choose Your Favourite Language: </p>
        <input type="radio" name="fav" id="html">
        <label for="html">HTML</label><br>
        <input type="radio" name="fav" id="css">
        <label for="css">CSS</label><br>
        <input type="radio" name="fav" id="js">
        <label for="js">JavaScript</label><br>

        <p>Choose Your Favourite Anime: </p>
        <input type="checkbox" name="favAnime" id="demonSlayer">
        <label for="demonSlayer">Demon Slayer</label>
        <input type="checkbox" name="favAnime" id="Naruto">
        <label for="Naruto">Naruto</label>
        <input type="checkbox" name="favAnime" id="One_piece">
        <label for="One_piece">One Piece</label>
        <br>
        <br>

        <label for="car">Select a Car: </label>
        <select name="Car" id="car">
            <option value="">Car Choices</option>
            <option value="volvo">Volvo</option>
            <option value="bugati">Bugati</option>
            <option value="audi">Audi</option>
            <option value="lamborghini">Lamborghini</option>
        </select>
        <br>
        <br>
        <input type="submit" value="submit">
    </form>

    <!-- The data of only those input elements is stored, in which name is specified. -->
</body>
</html>
