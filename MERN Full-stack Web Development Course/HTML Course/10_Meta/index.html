<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This tells us about the charset we have used for the webpage (here UTF-8) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- This helps in responsiveness of the webpage -->
    <title>Meta Tag</title>
    <meta name="description" content="This is Sample">
    <meta name="keywords" content="HTML, metadata, sample">
    <meta name="author" content="name">
    <!-- Meta Data is stored in meta tags, and are read by browser but not presented on the screen. Thus, this helps us in storing useful information on the browser without presenting it on the screen. -->
</head>
<body>
    
</body>
</html>
