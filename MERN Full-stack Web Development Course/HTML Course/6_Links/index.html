<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    Links helps us in connecting one webpage to another, whether on the same website or on different websites. On a webpage, we store URLs (uniform resource locator) in <a> tags which helps us in connecting different pages together. There are two types of URLs:-
     1. Absolute URLs
     2. Relative URLs
     An absolute URL provides the full address, including the protocol (https://) and domain, while a relative URL specifies a path relative to the current page.
     Absolute URLs are fixed and used for external links, whereas relative URLs are shorter, dependent on the current location, and ideal for internal site navigation.   
    -->
    <a href="https://www.google.com" target="_blank">Trip to Google</a> 
    <br>
    <a href="page.html">Trip to Page</a>
</body>
</html>
